<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The quarantine row in three depths: jars at rest on the back shelf, water circulating through the nearest tank while the fish holds and turns once, a hand sweeping the bench with a brush, and a microscope focus ring turning as its inset sharpens">
<rect x="0" y="0" width="1200" height="300" fill="#f1ead8"/>
<g fill="#d6dacE"><rect x="80" y="26" width="44" height="52" fill="#d6dace"/><rect x="150" y="26" width="44" height="52" fill="#d6dace"/><rect x="1020" y="26" width="44" height="52" fill="#d6dace"/></g><rect x="40" y="80" width="1120" height="8" fill="#6b4a2b"/>
<rect x="0" y="212" width="1200" height="88" fill="#6b4a2b"/>
<g><rect x="330" y="104" width="340" height="130" fill="none" stroke="#a88a3d" stroke-width="5"/><rect x="336" y="138" width="328" height="90" fill="#1e4d3b"/><line x1="336" y1="138" x2="664" y2="138" stroke="#f1ead8" stroke-width="4"/>
<g stroke="#9fc4ae" stroke-width="3" fill="none" stroke-dasharray="10 14"><path d="M346 200 H654"><animate attributeName="stroke-dashoffset" values="0;-96" dur="10s" repeatCount="indefinite"/></path></g>
<g><ellipse cx="500" cy="182" rx="42" ry="13" fill="#e2dcbe"><animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" keyTimes="0;0.5;1" dur="18s" repeatCount="indefinite" additive="sum"/><animateTransform attributeName="transform" type="translate" values="500 182;500 182;500 182" dur="18s" repeatCount="indefinite" additive="sum"/></ellipse></g></g>
<g><rect x="760" y="238" width="110" height="10" fill="#8a6a3a"><animateTransform attributeName="transform" type="translate" values="0 0;36 -4;0 0;36 -4;0 0" dur="12s" repeatCount="indefinite"/></rect><circle cx="766" cy="232" r="9" fill="#c49468"><animateTransform attributeName="transform" type="translate" values="0 0;36 -4;0 0;36 -4;0 0" dur="12s" repeatCount="indefinite"/></circle></g>
<g><circle cx="1050" cy="180" r="30" fill="none" stroke="#a88a3d" stroke-width="6"><animateTransform attributeName="transform" type="rotate" values="0 1050 180;24 1050 180;0 1050 180" dur="15s" repeatCount="indefinite"/></circle><circle cx="1050" cy="180" r="13" fill="#7fae94"><animate attributeName="opacity" values="0.35;1;0.35" dur="15s" repeatCount="indefinite"/></circle></g>
<rect x="880" y="196" width="130" height="42" fill="#f1ead8"/>
</svg>
